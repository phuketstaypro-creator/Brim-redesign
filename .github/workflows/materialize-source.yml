name: Materialize maintainable V3 source

on:
  push:
    paths:
      - 'source-bundle/part-07.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source-bundle/part-*.b64 | base64 --decode > /tmp/brim-source.tar.gz
          echo '052b4722b3f0165bf64994e875cab57b18cbe7938d0af06da14211796679b50a  /tmp/brim-source.tar.gz' | sha256sum --check

      - name: Replace technical payload with readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload build.mjs package.json
          tar -xzf /tmp/brim-source.tar.gz -C .

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize readable V3 multi-page source'
          git push origin HEAD:main

name: Patch V3 mobile layout

on:
  push:
    branches: [main]
    paths:
      - 'ops/mobile-layout-trigger.txt'

permissions:
  contents: write

jobs:
  patch-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out actual V3 source branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3-multipage
          fetch-depth: 0

      - name: Read maintained patch files from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:patches/mobile-layout.css > /tmp/mobile-layout.css
          git show origin/main:patches/mobile-menu.js > /tmp/mobile-menu.js

      - name: Inject responsive layout and stable mobile navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          css = Path('/tmp/mobile-layout.css').read_text(encoding='utf-8')
          js = Path('/tmp/mobile-menu.js').read_text(encoding='utf-8')
          start = '<!-- MOBILE-LAYOUT-V2 START -->'
          end = '<!-- MOBILE-LAYOUT-V2 END -->'
          source = re.sub(
              rf'\s*{re.escape(start)}.*?{re.escape(end)}\s*',
              '\n',
              source,
              flags=re.S,
          )
          patch = (
              f'\n{start}\n'
              f'<style id="mobile-layout-v2">\n{css}</style>\n'
              f'<script id="mobile-layout-controller-v2">\n{js}</script>\n'
              f'{end}\n'
          )
          if '</head>' not in source:
              raise SystemExit('index.html has no closing head tag')
          source = source.replace('</head>', patch + '</head>', 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit repaired source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Mobile layout patch already current.'
            exit 0
          fi
          git commit -m 'Fix mobile navigation and responsive layout'
          git push origin HEAD:fix/v3-multipage

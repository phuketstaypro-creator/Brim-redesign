name: Mobile visual check

on:
  push:
    branches: [main]
    paths:
      - 'ops/mobile-screenshot-trigger.txt'

permissions:
  contents: read

jobs:
  mobile-screenshot:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Check out patched V3 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3-multipage

      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/brim-server.log 2>&1 &
          echo $! >/tmp/brim-server.pid
          sleep 2

      - name: Capture mobile layouts and metrics
        shell: bash
        run: |
          mkdir -p artifacts
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'artifacts/mobile-closed.png', fullPage: true });
            const closed = await page.evaluate(() => {
              const rect = selector => {
                const el = document.querySelector(selector);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
              };
              return {
                viewport: { width: innerWidth, height: innerHeight },
                bodyScrollWidth: document.documentElement.scrollWidth,
                menuOpen: document.getElementById('nav')?.classList.contains('open'),
                hero: rect('.hero'),
                heroGrid: rect('.heroin'),
                title: rect('.hero h1'),
                aside: rect('.heroaside'),
                buttons: rect('.btns')
              };
            });
            await page.click('#menubtn');
            await page.waitForTimeout(350);
            await page.screenshot({ path: 'artifacts/mobile-menu-open.png', fullPage: false });
            const open = await page.evaluate(() => {
              const rect = selector => {
                const el = document.querySelector(selector);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
              };
              const nav = document.getElementById('nav');
              return {
                bodyScrollWidth: document.documentElement.scrollWidth,
                menuOpen: nav?.classList.contains('open'),
                bodyLocked: document.body.classList.contains('menu-open'),
                nav: rect('#nav'),
                button: rect('#menubtn'),
                navBackground: nav ? getComputedStyle(nav).backgroundColor : null,
                navVisibility: nav ? getComputedStyle(nav).visibility : null
              };
            });
            fs.writeFileSync('artifacts/metrics.json', JSON.stringify({ closed, open }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-check
          path: artifacts/
          retention-days: 3
